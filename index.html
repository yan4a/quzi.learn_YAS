<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>المذاكرة YAS الذكية</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=Reem+Kufi:wght@500;700&family=Poppins:wght@600&display=swap" rel="stylesheet">
<style>
:root{--bg:#070707;--surf:#14110e;--surf2:#1d1915;--bd:#322b22;--tx:#efe8dc;--mut:#a09585;--pri:#b9854e;--priT:#fff;--q:#6f98e0;--qbg:#0d1424;--a:#4fb39a;--abg:#0c1a17;--ok:#4fb39a;--bad:#e5766a;--r:18px;color-scheme:dark;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f6f1e9;--surf:#fffdf9;--surf2:#f0e9dd;--bd:#ddd1bf;--tx:#2a2218;--mut:#7b6e5c;--pri:#9a6a36;--q:#2f5fb8;--qbg:#eaf0fb;--a:#1c8a72;--abg:#e6f4ef;--ok:#1c8a72;--bad:#c9473a;color-scheme:light}}
:root[data-theme="light"]{--bg:#f6f1e9;--surf:#fffdf9;--surf2:#f0e9dd;--bd:#ddd1bf;--tx:#2a2218;--mut:#7b6e5c;--pri:#9a6a36;--q:#2f5fb8;--qbg:#eaf0fb;--a:#1c8a72;--abg:#e6f4ef;--ok:#1c8a72;--bad:#c9473a;color-scheme:light}
:root[data-theme="dark"]{color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:"Cairo",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;line-height:1.75;min-height:100%;transition:background .4s,color .4s}
.wrap{max-width:900px;margin:0 auto;padding:16px}
svg.i{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em;flex:none}
@keyframes up{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes s{to{transform:rotate(360deg)}}
@keyframes rot{to{transform:rotate(360deg)}}
header{display:flex;align-items:center;gap:12px;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;animation:up .5s both}
.logo{display:flex;align-items:center;gap:8px;font-family:"Reem Kufi","Cairo",sans-serif;font-weight:700;font-size:1.55rem;letter-spacing:.3px}
.logo span{background:linear-gradient(135deg,var(--tx),var(--pri));-webkit-background-clip:text;background-clip:text;color:transparent}
.logo em{font:600 .6rem/1 "Poppins",sans-serif;letter-spacing:2.5px;color:var(--priT);background:var(--pri);padding:5px 7px 5px 9px;border-radius:7px;transform:translateY(1px);font-style:normal;direction:ltr}
nav{display:flex;gap:4px;background:var(--surf);padding:4px;border-radius:999px;border:1px solid var(--bd)}
nav button,.btn{font:inherit;border:0;cursor:pointer;border-radius:999px;padding:8px 15px;background:transparent;color:var(--mut);transition:transform .15s,background .25s,color .25s,box-shadow .25s,opacity .2s;display:inline-flex;align-items:center;gap:7px}
nav button.on{background:var(--pri);color:var(--priT)}nav button:not(.on):hover{color:var(--tx)}
.icon{width:42px;height:42px;border-radius:50%;border:1px solid var(--bd);background:var(--surf);color:var(--tx);cursor:pointer;display:grid;place-items:center;transition:transform .2s}.icon:hover{transform:rotate(18deg)}
button:active:not(:disabled){transform:scale(.93)}
.panel{background:var(--surf);border:1px solid var(--bd);border-radius:var(--r);padding:16px;margin-bottom:14px;animation:up .5s both}
.panel.q{background:var(--qbg);border-color:color-mix(in srgb,var(--q) 35%,var(--bd))}
.panel.a{background:var(--abg);border-color:color-mix(in srgb,var(--a) 35%,var(--bd))}
.lab{display:flex;align-items:center;gap:8px;font-weight:700;margin-bottom:8px}.q .lab{color:var(--q)}.a .lab{color:var(--a)}
textarea,input[type=text],select{width:100%;font:inherit;font-size:1.05rem;background:color-mix(in srgb,var(--bg) 55%,var(--surf2));color:var(--tx);border:1px solid var(--bd);border-radius:12px;padding:11px 12px;outline:none;transition:border-color .2s,box-shadow .2s}
textarea{resize:vertical;min-height:84px}
textarea:focus,input:focus,select:focus{border-color:var(--pri);box-shadow:0 0 0 3px color-mix(in srgb,var(--pri) 22%,transparent)}
select{width:auto;padding:7px 10px;max-width:100%}
.btn{background:var(--pri);color:var(--priT);font-weight:700}
.btn:hover:not(:disabled){box-shadow:0 6px 18px color-mix(in srgb,var(--pri) 35%,transparent);transform:translateY(-1px)}
.btn.sec{background:var(--surf2);color:var(--tx);border:1px solid var(--bd)}.btn.g{background:var(--a);color:#06100d}.btn.r{background:var(--bad);color:#fff}.btn.sm{padding:5px 12px;font-size:.88rem}
.btn:disabled{opacity:.55;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.sp{flex:1}
.kbtog{font:inherit;border:1px solid var(--bd);background:var(--surf2);color:var(--tx);border-radius:10px;padding:5px 12px;cursor:pointer;display:inline-flex;gap:7px;align-items:center}
.kbtog .ch{transition:transform .35s}body.nokb .kbtog .ch{transform:rotate(180deg)}
.kbwrap{display:grid;grid-template-rows:1fr;opacity:1;transition:grid-template-rows .4s cubic-bezier(.4,0,.2,1),opacity .3s,margin .3s;margin-top:10px}
.kbwrap>div{overflow:hidden;min-height:0}
body.nokb .kbwrap{grid-template-rows:0fr;opacity:0;margin-top:0}
.kbt{display:flex;gap:6px;margin:2px 0 8px}.kbt button{font:inherit;font-size:.85rem;border:1px solid var(--bd);background:var(--surf2);color:var(--mut);border-radius:8px;padding:2px 14px;cursor:pointer;transition:.2s}.kbt button.on{color:var(--priT);background:var(--pri);border-color:var(--pri)}
.keys{display:flex;flex-wrap:wrap;gap:6px;direction:ltr;padding-bottom:2px}
.k{min-width:42px;height:40px;font-size:1.05rem;border-radius:10px;border:1px solid var(--bd);background:var(--surf2);color:var(--tx);cursor:pointer;font-family:system-ui,"Cambria Math",serif;padding:0 8px;animation:pop .3s both;transition:.15s}
.k:hover{border-color:var(--pri);transform:translateY(-2px)}.k.w{background:var(--pri);color:var(--priT);border-color:var(--pri)}
.card{display:flex;gap:12px;align-items:flex-start;padding:12px;border:1px solid var(--bd);border-radius:14px;margin-bottom:10px;background:var(--surf2);animation:up .45s both;transition:border-color .2s,transform .2s}
.card:hover{border-color:var(--pri);transform:translateX(-3px)}
.card .t{flex:1;min-width:0;white-space:pre-wrap;word-break:break-word}.card .t small{color:var(--mut);margin-inline-end:6px}
.card .qq{color:var(--q);font-weight:700}.card .aa{color:var(--a)}
.tag{display:inline-flex;gap:5px;align-items:center;font-size:.8rem;color:var(--pri);background:color-mix(in srgb,var(--pri) 14%,transparent);padding:1px 9px;border-radius:99px;border:0;font-family:inherit;cursor:default;margin-inline-end:4px}
button.tag{cursor:pointer}
.mini{border:0;background:transparent;color:var(--mut);cursor:pointer;padding:6px;border-radius:8px;transition:.2s}.mini:hover{color:var(--tx);background:var(--surf)}
.mut{color:var(--mut)}.empty{text-align:center;color:var(--mut);padding:26px}
.tbar{height:8px;background:var(--surf2);border-radius:9px;overflow:hidden;margin:8px 0}.tbar i{display:block;height:100%;background:linear-gradient(90deg,var(--a),var(--pri));transition:width .25s linear}
.timer{font-variant-numeric:tabular-nums;font-size:1.3rem;font-weight:700;display:flex;gap:7px;align-items:center}.timer.low{color:var(--bad)}
.qtext{font-size:1.3rem;font-weight:500;white-space:pre-wrap;word-break:break-word}
.fb{border-radius:var(--r);padding:14px;margin-bottom:14px;border:1px solid var(--bd);background:var(--surf);animation:up .5s both}
.fb.ok{border-color:var(--ok)}.fb.no{border-color:var(--bad)}
.verdict{font-size:1.25rem;font-weight:700;display:flex;gap:8px;align-items:center}.ok .verdict{color:var(--ok)}.no .verdict{color:var(--bad)}
.verdict svg{width:1.5em;height:1.5em;animation:pop .5s .1s both}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.cmp div{background:var(--surf2);border-radius:10px;padding:10px;white-space:pre-wrap;word-break:break-word}.cmp span{display:block;font-size:.8rem;color:var(--mut)}
.big{font-size:3.2rem;font-weight:700;line-height:1.2;animation:pop .6s both}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0;text-align:center}.stats div{background:var(--surf2);border-radius:12px;padding:10px}
.hide{display:none!important}
.res{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd);animation:up .4s both}.res:last-child{border:0}.dot{width:12px;height:12px;border-radius:50%;flex:none}
.spin{display:inline-block;width:16px;height:16px;border:3px solid color-mix(in srgb,currentColor 30%,transparent);border-top-color:currentColor;border-radius:50%;animation:s .8s linear infinite}
.v{animation:up .45s both}
.refbox{white-space:pre-wrap;color:var(--mut);font-size:.92rem;margin-top:4px}
.quote{border-inline-start:3px solid var(--a);padding:4px 10px;margin-top:8px;color:var(--mut);font-size:.9rem;white-space:pre-wrap}
label.ck{display:inline-flex;gap:7px;align-items:center;cursor:pointer}
.up{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.up input{display:none}
.fbadge{display:inline-flex;gap:6px;align-items:center;background:var(--surf2);border:1px solid var(--bd);border-radius:99px;padding:3px 6px 3px 12px;font-size:.9rem}
/* periodic table */
.ptw{overflow-x:auto;padding-bottom:8px}
.pt{display:grid;grid-template-columns:repeat(18,minmax(44px,1fr));grid-template-rows:repeat(7,auto) 12px auto auto;gap:3px;min-width:860px}
.el{--c:var(--pri);font:inherit;cursor:pointer;border-radius:8px;border:1px solid color-mix(in srgb,var(--c) 45%,var(--bd));background:color-mix(in srgb,var(--c) 14%,var(--surf));color:var(--tx);padding:2px 2px 3px;text-align:center;line-height:1.15;animation:pop .35s both;transition:transform .15s,opacity .25s,box-shadow .2s;position:relative}
.el:hover{transform:scale(1.18);z-index:3;box-shadow:0 8px 20px rgba(0,0,0,.45)}
.el small{display:block;font-size:.62rem;color:var(--mut);text-align:start;padding-inline-start:3px}
.el b{display:block;font:700 1.05rem/1.1 "Poppins",system-ui,sans-serif;color:var(--c)}
.el span{display:block;font-size:.6rem;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.el.dim{opacity:.15}
.ph{border:1px dashed var(--bd);border-radius:8px;display:grid;place-items:center;font-size:.65rem;color:var(--mut)}
:root{--hl:#c8ff2e;--hlT:#0d1205}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--hl:#5aa800;--hlT:#fff}}
:root[data-theme="light"]{--hl:#5aa800;--hlT:#fff}
:root[data-theme="dark"]{--hl:#c8ff2e;--hlT:#0d1205}
@keyframes hlp{50%{transform:scale(1.12)}}
.el.hit{background:var(--hl);border-color:var(--hl);box-shadow:0 0 0 2px color-mix(in srgb,var(--hl) 45%,transparent),0 0 18px color-mix(in srgb,var(--hl) 65%,transparent);animation:hlp 1.6s ease-in-out infinite;z-index:2}
.el.hit b,.el.hit small,.el.hit span{color:var(--hlT)}
.c-alkali{--c:#e07a6a}.c-alk2{--c:#dd9c52}.c-tr{--c:#6f98e0}.c-post{--c:#7fb0a8}.c-meta{--c:#a88ee0}.c-non{--c:#4fb39a}.c-hal{--c:#d8c55c}.c-noble{--c:#c987c9}.c-lan{--c:#5cbbdc}.c-act{--c:#df80a6}
.leg{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.leg button{--c:var(--pri);font:inherit;font-size:.82rem;border:1px solid color-mix(in srgb,var(--c) 50%,var(--bd));background:color-mix(in srgb,var(--c) 12%,var(--surf));color:var(--tx);border-radius:99px;padding:2px 12px;cursor:pointer;transition:.2s}
.leg button.on{background:var(--c);color:#0b0b0b}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.62);display:grid;place-items:center;padding:14px;z-index:50;animation:fade .25s both;backdrop-filter:blur(3px)}
@keyframes fade{from{opacity:0}}
.sheet{background:var(--surf);border:1px solid var(--bd);border-radius:22px;max-width:620px;width:100%;max-height:92vh;overflow:auto;padding:18px;animation:up .35s both;position:relative}
.bohr{width:100%;max-width:260px;display:block;margin:0 auto}
.bohr g.sh{transform-origin:130px 130px;animation:rot linear infinite}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:10px 0}
.grid2 div{background:var(--surf2);border-radius:10px;padding:6px 10px}.grid2 span{display:block;font-size:.78rem;color:var(--mut)}
.cfg{direction:ltr;text-align:center;font-family:"Cambria Math",system-ui,serif;font-size:1.05rem;word-spacing:4px;background:var(--surf2);border-radius:10px;padding:8px}
.tundo{font:inherit;font-weight:700;margin-inline-start:14px;background:var(--bg);color:var(--tx);border:0;border-radius:99px;padding:2px 16px;cursor:pointer}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:9px 20px;border-radius:99px;font-weight:600;z-index:80;animation:up .3s both}
@media(max-width:560px){.cmp{grid-template-columns:1fr}nav button span{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="logo" aria-label="المذاكرة YAS الذكية"><span>المذاكرة</span><em>YAS</em><span>الذكية</span></div>
  <nav><button id="tAdd" class="on"><i data-i="q"></i><span>الأسئلة</span></button><button id="tTest"><i data-i="play"></i><span>اختبار</span></button><button id="tRef"><i data-i="book"></i><span>المراجع</span></button><button id="tPt"><i data-i="atom"></i><span>الجدول الدوري</span></button></nav>
  <button class="icon" id="themeBtn" title="الوضع الداكن / الفاتح"></button>
</header>

<!-- الأسئلة -->
<main id="vAdd" class="v">
  <div class="panel q"><div class="lab"><i data-i="q"></i>السؤال</div><textarea id="qIn" placeholder="اكتب السؤال هنا… مثال: ما عاصمة فلسطين؟"></textarea></div>
  <div class="panel a"><div class="lab"><i data-i="a"></i>الإجابة الصحيحة</div><textarea id="aIn" placeholder="اكتب الإجابة… أو اتركها فاضية واختر مرجعاً"></textarea>
    <div class="row" style="margin-top:10px"><span class="mut"><i data-i="book"></i> المرجع:</span><select id="refSel"></select></div></div>
  <div class="panel"><div id="kb1"></div></div>
  <div class="row" style="margin-bottom:14px"><button class="btn g" id="addBtn"><i data-i="plus"></i><b>حفظ السؤال</b></button><button class="btn sec" id="goTest"><i data-i="play"></i>ابدأ الاختبار</button><span class="mut" id="msg"></span></div>
  <div class="panel"><div class="lab"><i data-i="cards"></i>أسئلتي (<span id="cnt">0</span>)</div><input type="text" id="qs" placeholder="بحث في الأسئلة…" style="margin-bottom:10px"><div id="list"></div></div>
  <div class="panel q"><div class="lab"><i data-i="search"></i>فحص سريع من المراجع</div><textarea id="cQ" placeholder="اكتب السؤال…"></textarea></div>
  <div class="panel a"><div class="lab"><i data-i="pen"></i>إجابتك</div><textarea id="cA" placeholder="اكتب إجابتك أو اتركها فاضية…"></textarea>
    <div class="row" style="margin-top:10px"><span class="mut">المرجع:</span><select id="cSel"></select></div></div>
  <div class="row" style="margin-bottom:14px"><button class="btn" id="cGo"><i data-i="search"></i><b>تحقق</b></button></div>
  <div id="cOut"></div>
</main>

<main id="vTest" class="hide"></main>

<!-- المراجع -->
<main id="vRef" class="hide">
  <div class="panel"><div class="lab"><i data-i="book"></i>أضف مرجعاً</div>
    <input type="text" id="rT" placeholder="اسم المرجع" style="margin-bottom:10px">
    <div class="up"><label class="btn sec"><i data-i="upload"></i>اختر ملفاً<input type="file" id="rF" accept=".pdf,.docx,.txt,.md,.csv,image/*"></label><span class="mut" style="font-size:.88rem">PDF • Word • نص • صورة</span><span id="rB"></span></div>
    <textarea id="rX" style="min-height:130px" placeholder="أو اكتب / الصق النص هنا…"></textarea>
    <div class="row" style="margin-top:10px"><button class="btn g" id="rAdd"><i data-i="plus"></i><b>حفظ المرجع</b></button><span class="mut" id="rMsg"></span></div></div>
  <div class="panel"><div class="lab"><i data-i="cards"></i>مراجعي (<span id="rCnt">0</span>)</div><div id="rList"></div></div>
</main>

<!-- الجدول الدوري -->
<main id="vPt" class="hide">
  <div class="panel"><input type="text" id="ptS" placeholder="ابحث باسم العنصر أو رمزه أو رقمه…" style="margin-bottom:10px"><div class="mut" id="ptN" style="margin:-4px 0 8px;font-size:.88rem"></div><div class="leg" id="leg"></div><div class="ptw"><div class="pt" id="pt"></div></div></div>
</main>
</div>
<div id="modalHost"></div>

<script>
const $=s=>document.querySelector(s);
const e=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function load(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(x){return d}}

async function getSample(){if(sampleP)return sampleP;sampleP=(async()=>{try{return window.claude?await claude.use('sample'):null}catch(x){return null}})();return sampleP}
function tokens(s){return norm(s).split(' ').filter(w=>w.length>2)}
function pickChunks(text,q,budget){
  if(text.length<=budget)return text;
  const parts=text.split(/\n+/).flatMap(p=>p.length>700?p.match(/.{1,600}(\s|$)/g)||[p]:[p]),tk=tokens(q);
  const sc=parts.map((p,i)=>{const n=norm(p);return{i,p,s:tk.reduce((a,w)=>a+(n.includes(w)?1:0),0)}});
  const top=sc.slice().sort((a,b)=>b.s-a.s),used=new Set();let tot=0;
  for(const x of top){if(tot+x.p.length>budget)continue;used.add(x.i);tot+=x.p.length}
  return sc.filter(x=>used.has(x.i)).map(x=>x.p).join('\n')}
function relatedCards(q,n,skipId){const tk=tokens(q);if(!tk.length)return[];
  return cards.filter(c=>c.id!==skipId).map(c=>{const t=norm(c.q+' '+(c.a||''));return{c,s:tk.reduce((a,w)=>a+(t.includes(w)?1:0),0)}}).filter(x=>x.s>0).sort((a,b)=>b.s-a.s).slice(0,n).map(x=>x.c)}
function buildCtx(q,id,skipId){

  const rel=relatedCards(q,5,skipId);if(rel.length)parts.push('=== أسئلة وإجابات محفوظة ذات صلة ===\n'+rel.map(c=>`س: ${c.q}${c.a?' — ج: '+c.a:''}`).join('\n'));
  const budget=Math.floor(12000/Math.max(1,list.length));
  list.forEach(r=>{if(r.text)parts.push(`=== مرجع: ${r.title} ===\n`+pickChunks(r.text,q,budget))});
  const imgs=list.filter(r=>r.img).slice(0,3).map(r=>r.img);

  try{return await ask(sm,`أنت مدقق إجابات. اعتمد فقط على المادة التالية (مراجع، معلومات عناصر، أسئلة محفوظة، وأي صور مرفقة) ولا تستخدم معلومات من خارجها.\n\n${B.ctx}\n=== نهاية المادة ===\n\nالسؤال: ${q}\nإجابة الطالب: ${ans||'(لم يكتب إجابة)'}\n\nالمطلوب: ابحث عن إجابة السؤال في المادة. إذا وجدتها قارن بها إجابة الطالب. تجاهل التفاصيل التافهة (همزات، تشكيل، "ال"، أخطاء إملائية طفيفة، صياغة مختلفة بنفس المعنى) لكن اعتبرها خاطئة إذا اختلف المعنى أو أي رقم أو اسم أو إشارة. إذا لم يكتب الطالب إجابة فاجعل correct=false.\nأجب بـ JSON فقط: {"found":true أو false,"correct":true أو false,"right_answer":"الإجابة الصحيحة بإيجاز","quote":"جملة قصيرة من المادة تدعم ذلك","note":"سبب قصير بالعربية"}`,B.imgs)}catch(x){return{err:ERR}}}
async function genQ({title,text,imgs,n=5,ref='',el=0,btn}){
  const sm=await getSample();if(!sm){toast(ERR);return 0}
  const old=btn?btn.innerHTML:'';if(btn){btn.disabled=true;btn.innerHTML='<span class="spin"></span>'}
  let added=0;
  try{
    const have=cards.slice(-40).map(c=>c.q).join('\n')||'لا يوجد';
    const r=await ask(sm,`أنشئ ${n} أسئلة اختبار بالعربية مع إجابات قصيرة ودقيقة، اعتماداً فقط على المادة التالية. نوّع الأسئلة (تعريف، حقيقة، سبب، مقارنة، حساب إن أمكن) ولا تكرر ولا تشابه الأسئلة الموجودة.\n\nالمادة (${title}):\n${text}\n\nالأسئلة الموجودة أصلاً:\n${have}\n\nأجب بـ JSON فقط: [{"q":"السؤال","a":"الإجابة"}]`,imgs);
    const arr=Array.isArray(r)?r:(r&&r.questions)||[];
    const seen=new Set(cards.map(c=>norm(c.q)));
    arr.forEach(x=>{if(x&&x.q&&x.a&&!seen.has(norm(x.q))){seen.add(norm(x.q));cards.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),q:String(x.q),a:String(x.a),ref,el});added++}});
    if(added){commit();renderAll()}
    toast(added?`أُضيف ${added} أسئلة`:ERR)
  }catch(x){toast(ERR)}
  if(btn){btn.disabled=false;btn.innerHTML=old}
  return added}

/* ====== التصحيح ====== */
function norm(s){return String(s).toLowerCase().replace(/[\u064B-\u065F\u0670\u0640]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/[٠-٩]/g,d=>d.charCodeAt(0)-1632).replace(/[۰-۹]/g,d=>d.charCodeAt(0)-1776).replace(/٫|،(?=\d)/g,'.').replace(/[^\p{L}\p{N}.\/^+\-*=<>()√π²³°]/gu,' ').replace(/(^|\s)ال(?=\S{2})/g,'$1').replace(/\s+/g,' ').trim()}
function num(s){let t=norm(s).replace(/\s/g,'').replace(/^\((.*)\)$/,'$1').replace(/^\(([^()]*)\)\/\(([^()]*)\)$/,'$1/$2');const m=t.match(/^(-?\d+(?:\.\d+)?)(?:\/(\d+(?:\.\d+)?))?$/);if(!m)return null;return m[2]?(+m[1])/(+m[2]):+m[1]}
function lev(a,b){const m=a.length,n=b.length;if(!m||!n)return Math.max(m,n);let p=Array.from({length:n+1},(_,j)=>j);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
async function grade(c,ans){
  if(!c.a){const r=await refCheck(c.q,ans,c.ref||'all',c.id);
    if(r.err)return{ok:false,note:r.err};
    if(!r.found)return{ok:false,note:'لم أجد إجابة هذا السؤال في المراجع.',correct:'— غير موجودة في المراجع —'};
    return{ok:!!r.correct&&!!ans.trim(),note:r.note||'',correct:r.right_answer,quote:r.quote}}
  if(!ans.trim())return{ok:false,note:'لا توجد إجابة.'};
  const A=norm(c.a),B=norm(ans);
  if(A===B||A.replace(/ /g,'')===B.replace(/ /g,''))return{ok:true,note:'مطابقة للإجابة النموذجية.'};
  const x=num(c.a),y=num(ans);
  if(x!==null&&y!==null)return Math.abs(x-y)<1e-9*Math.max(1,Math.abs(x))?{ok:true,note:'القيمة العددية متطابقة.'}:{ok:false,note:'القيمة العددية مختلفة.'};
  const sm=await getSample();
  if(sm){try{
    const B2=buildCtx(c.q+' '+c.a,c.ref||'all',c.id);
    const r=await ask(sm,`أنت مصحح اختبارات متسامح لكن دقيق. قارن إجابة الطالب بالإجابة النموذجية للسؤال.\nاعتبر الإجابة صحيحة إذا كان المعنى والمضمون نفسه، وتجاهل التفاصيل التافهة: الهمزات، التشكيل، "ال" التعريف، الأخطاء الإملائية الطفيفة، اختلاف ترتيب الكلمات، الاختصار، أو الإضافات الصحيحة غير الضرورية.\nلكن اعتبرها خاطئة إذا اختلف المعنى أو أي رقم أو قيمة أو اسم أو اتجاه أو إشارة (+/−) أو وحدة جوهرية، أو إذا كانت ناقصة بشكل يفقدها المعنى المطلوب. الكسور والأعداد المتكافئة (1/2 = 0.5 = ٠٫٥) متساوية.\n${B2.ctx?`\nمعلومات مساعدة (للتحقق فقط):\n${B2.ctx.slice(0,5000)}\n`:''}\nالسؤال: ${c.q}\nالإجابة النموذجية: ${c.a}\nإجابة الطالب: ${ans}\n\nأجب بـ JSON فقط بهذا الشكل: {"correct":true أو false,"note":"جملة عربية قصيرة جداً تشرح السبب"}`,[],'quick');
    return{ok:!!r.correct,note:r.note||''}}catch(x){}}
  const sim=1-lev(A,B)/Math.max(A.length,B.length);
  return sim>=0.82?{ok:true,note:'قريبة جداً من الإجابة.'}:{ok:false,note:'الإجابة تختلف عن النموذجية.'}}

/* ====== الاختبار ====== */
const V=$('#vTest');
function stopT(){if(T&&T.iv)clearInterval(T.iv)}
const fmt=s=>{s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
function scopeList(v){if(v==='chem')return cards.filter(c=>c.el||mentions(c.q+' '+(c.a||'')).length);if(v.startsWith('ref:'))return cards.filter(c=>c.ref===v.slice(4));return cards.slice()}
function setup(){
  T=null;
  if(!cards.length){V.innerHTML=`<div class="panel empty">أضف أسئلة أولاً من صفحة «الأسئلة».</div>`;return}
  const chem=scopeList('chem').length,rs=refs.filter(r=>cards.some(c=>c.ref===r.id));
  V.innerHTML=`<div class="panel"><div class="lab">${I('target')}إعدادات الاختبار</div>
  <div class="row" style="margin-bottom:10px"><label class="ck">${I('cards')} الأسئلة: <select id="scp"><option value="all">الكل (${cards.length})</option>${chem?`<option value="chem">كيمياء (${chem})</option>`:''}${rs.map(r=>`<option value="ref:${r.id}">${e(r.title)} (${scopeList('ref:'+r.id).length})</option>`).join('')}</select></label></div>
  <div class="row"><label class="ck">${I('clock')} وقت كل سؤال: <select id="lim">${[[30,'30 ثانية'],[60,'دقيقة'],[120,'دقيقتان'],[300,'5 دقائق'],[0,'بدون حد']].map(o=>`<option value="${o[0]}" ${o[0]==cfg.limit?'selected':''}>${o[1]}</option>`).join('')}</select></label>
  <label class="ck"><input type="checkbox" id="shf" ${cfg.shuffle?'checked':''}> ترتيب عشوائي</label></div>
  <p style="margin-bottom:0"><button class="btn" id="go">${I('play')}<b>ابدأ الاختبار</b></button></p></div>`;
  $('#go').onclick=()=>{cfg.limit=+$('#lim').value;cfg.shuffle=$('#shf').checked;save('cfg',cfg);start(scopeList($('#scp').value))}}
function start(list){
  if(cfg.shuffle)list.sort(()=>Math.random()-.5);
  T={list,i:0,res:[],iv:null,t0:0,busy:false};askQ()}
function askQ(){
  const c=T.list[T.i];T.busy=false;
  V.innerHTML=`<div class="row panel" style="padding:10px 16px;margin-bottom:10px"><b>سؤال ${T.i+1} / ${T.list.length}</b><span class="sp"></span><span class="timer" id="tm">${I('clock')}<span>0:00</span></span></div><div class="tbar ${cfg.limit?'':'hide'}"><i id="tb" style="width:100%"></i></div>
  <div class="panel q"><div class="lab">${I('q')}السؤال</div><div class="qtext">${e(c.q)}</div></div>
  <div class="panel a"><div class="lab">${I('pen')}إجابتك</div><textarea id="ans" placeholder="اكتب إجابتك هنا…"></textarea><div id="kb2"></div></div>
  <div class="row"><button class="btn" id="sub">${I('check')}<b>تحقق من الإجابة</b></button><button class="btn sec" id="skip">${I('skip')}تخطي</button><button class="btn sec" id="quit">${I('flag')}إنهاء</button></div>`;
  mountKB('#kb2');$('#ans').focus();last=$('#ans');
  T.t0=Date.now();T.mode='ask';stopT();
  T.iv=setInterval(()=>{const s=(Date.now()-T.t0)/1000,tm=$('#tm');if(!tm)return;const sp=tm.lastElementChild;
    if(cfg.limit){const r=cfg.limit-s;sp.textContent=fmt(Math.ceil(r));tm.classList.toggle('low',r<=10);$('#tb').style.width=Math.max(0,r/cfg.limit*100)+'%';if(r<=0)submit(true)}
    else sp.textContent=fmt(s)},250);
  $('#sub').onclick=()=>submit(false);
  $('#skip').onclick=()=>{stopT();T.res.push({c,ans:'',ok:false,note:'تم تخطي السؤال.',time:elapsed(),correct:c.a});next()};
  $('#quit').onclick=()=>{stopT();finish()}}
function elapsed(){return Math.min((Date.now()-T.t0)/1000,cfg.limit||1e9)}
async function submit(timeout){
  if(T.busy)return;T.busy=true;stopT();
  const c=T.list[T.i],ans=($('#ans')||{}).value||'',time=elapsed();
  $('#sub').disabled=true;$('#sub').innerHTML='<span class="spin"></span><b>جارٍ التصحيح…</b>';$('#ans').disabled=true;
  const g=await grade(c,ans);T.res.push({c,ans,ok:g.ok,note:g.note,time,timeout,correct:g.correct||c.a,quote:g.quote});
  feedback(T.res[T.res.length-1])}
function feedback(r){T.mode='fb';
  const lastQ=T.i>=T.list.length-1;
  V.innerHTML=`<div class="fb ${r.ok?'ok':'no'}"><div class="verdict">${I(r.ok?'a':'x')}${r.ok?'إجابة صحيحة':'إجابة غير صحيحة'}${r.timeout?' (انتهى الوقت)':''}</div>
  <div class="mut">${e(r.note||'')} • ${fmt(r.time)}</div>
  <div class="panel q" style="margin:10px 0 0;animation:none"><div class="lab">${I('q')}السؤال</div><div style="white-space:pre-wrap">${e(r.c.q)}</div></div>
  <div class="cmp"><div><span>إجابتك</span>${e(r.ans||'— بدون إجابة —')}</div><div><span>الإجابة الصحيحة</span>${e(r.correct||'—')}</div></div>${r.quote?`<div class="quote">${e(r.quote)}</div>`:''}
  <button class="btn sec" id="ov">${r.ok?'اعتبرها خاطئة':'اعتبرها صحيحة'}</button></div>
  <div class="row"><button class="btn" id="nx"><b>${lastQ?'عرض النتيجة':'السؤال التالي'}</b>${I(lastQ?'flag':'next')}</button></div>`;
  $('#ov').onclick=()=>{r.ok=!r.ok;r.note='عُدّل التقييم.';feedback(r)};
  $('#nx').onclick=next}
function next(){T.i++;T.i>=T.list.length?finish():askQ()}
function finish(){T.done=true;T.mode='done';
  stopT();const R=T.res,ok=R.filter(x=>x.ok).length,n=R.length||1,avg=R.reduce((s,x)=>s+x.time,0)/n,pct=Math.round(ok/n*100);
  const bad=R.filter(x=>!x.ok).map(x=>x.c);
  V.innerHTML=`<div class="panel" style="text-align:center"><div class="big" style="color:${pct>=60?'var(--ok)':'var(--bad)'}">${pct}%</div><div>${pct>=90?'ممتاز!':pct>=60?'جيد، كمّل':'كرّر وراح تتحسن'}</div>
  <div class="stats"><div><b>${ok}</b><br><span class="mut">صحيحة</span></div><div><b>${R.length-ok}</b><br><span class="mut">خاطئة</span></div><div><b>${fmt(avg)}</b><br><span class="mut">متوسط الوقت</span></div></div>
  <div class="row" style="justify-content:center">${bad.length?`<button class="btn r" id="rt">${I('redo')}أعد الأسئلة الخاطئة</button>`:''}<button class="btn" id="again">${I('play')}اختبار جديد</button></div></div>
  <div class="panel"><div class="lab">${I('cards')}مراجعة</div>${R.map((x,i)=>`<div class="res" style="animation-delay:${Math.min(i,12)*40}ms"><span class="dot" style="background:var(--${x.ok?'ok':'bad'})"></span><div style="flex:1;min-width:0"><div style="white-space:pre-wrap;word-break:break-word"><b>${i+1}.</b> ${e(x.c.q)}</div>${x.ok?'':`<small class="mut">إجابتك: ${e(x.ans||'—')} • الصحيحة: <span style="color:var(--a)">${e(x.correct||'—')}</span></small>`}</div><span class="mut">${fmt(x.time)}</span></div>`).join('')}</div>`;
  if($('#rt'))$('#rt').onclick=()=>start(bad.slice());$('#again').onclick=setup}

icons();applyTheme();mountKB('#kb1');renderAll();
</script>
