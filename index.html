<<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>المذاكرة YAS الذكية</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=Reem+Kufi:wght@500;700&family=Poppins:wght@600&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#070707;--surf:#14110e;--surf2:#1d1915;--bd:#322b22;--tx:#efe8dc;--mut:#a09585;--pri:#b9854e;--priT:#fff;--q:#6f98e0;--qbg:#0d1424;--a:#4fb39a;--abg:#0c1a17;--ok:#4fb39a;--bad:#e5766a;--r:18px;color-scheme:dark;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f6f1e9;--surf:#fffdf9;--surf2:#f0e9dd;--bd:#ddd1bf;--tx:#2a2218;--mut:#7b6e5c;--pri:#9a6a36;--q:#2f5fb8;--qbg:#eaf0fb;--a:#1c8a72;--abg:#e6f4ef;--ok:#1c8a72;--bad:#c9473a;color-scheme:light}}
:root[data-theme="light"]{--bg:#f6f1e9;--surf:#fffdf9;--surf2:#f0e9dd;--bd:#ddd1bf;--tx:#2a2218;--mut:#7b6e5c;--pri:#9a6a36;--q:#2f5fb8;--qbg:#eaf0fb;--a:#1c8a72;--abg:#e6f4ef;--ok:#1c8a72;--bad:#c9473a;color-scheme:light}
:root[data-theme="dark"]{color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:"Cairo",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;line-height:1.75;min-height:100%;transition:background .4s,color .4s}
.wrap{max-width:900px;margin:0 auto;padding:16px}
svg.i{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em;flex:none}
@keyframes up{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes s{to{transform:rotate(360deg)}}
@keyframes rot{to{transform:rotate(360deg)}}
header{display:flex;align-items:center;gap:12px;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;animation:up .5s both}
.logo{display:flex;align-items:center;gap:8px;font-family:"Reem Kufi","Cairo",sans-serif;font-weight:700;font-size:1.55rem;letter-spacing:.3px}
.logo span{background:linear-gradient(135deg,var(--tx),var(--pri));-webkit-background-clip:text;background-clip:text;color:transparent}
.logo em{font:600 .6rem/1 "Poppins",sans-serif;letter-spacing:2.5px;color:var(--priT);background:var(--pri);padding:5px 7px 5px 9px;border-radius:7px;transform:translateY(1px);font-style:normal;direction:ltr}
nav{display:flex;gap:4px;background:var(--surf);padding:4px;border-radius:999px;border:1px solid var(--bd)}
nav button,.btn{font:inherit;border:0;cursor:pointer;border-radius:999px;padding:8px 15px;background:transparent;color:var(--mut);transition:transform .15s,background .25s,color .25s,box-shadow .25s,opacity .2s;display:inline-flex;align-items:center;gap:7px}
nav button.on{background:var(--pri);color:var(--priT)}nav button:not(.on):hover{color:var(--tx)}
.icon{width:42px;height:42px;border-radius:50%;border:1px solid var(--bd);background:var(--surf);color:var(--tx);cursor:pointer;display:grid;place-items:center;transition:transform .2s}.icon:hover{transform:rotate(18deg)}
button:active:not(:disabled){transform:scale(.93)}
.panel{background:var(--surf);border:1px solid var(--bd);border-radius:var(--r);padding:16px;margin-bottom:14px;animation:up .5s both}
.panel.q{background:var(--qbg);border-color:color-mix(in srgb,var(--q) 35%,var(--bd))}
.panel.a{background:var(--abg);border-color:color-mix(in srgb,var(--a) 35%,var(--bd))}
.lab{display:flex;align-items:center;gap:8px;font-weight:700;margin-bottom:8px}.q .lab{color:var(--q)}.a .lab{color:var(--a)}
textarea,input[type=text],select{width:100%;font:inherit;font-size:1.05rem;background:color-mix(in srgb,var(--bg) 55%,var(--surf2));color:var(--tx);border:1px solid var(--bd);border-radius:12px;padding:11px 12px;outline:none;transition:border-color .2s,box-shadow .2s}
textarea{resize:vertical;min-height:84px}
textarea:focus,input:focus,select:focus{border-color:var(--pri);box-shadow:0 0 0 3px color-mix(in srgb,var(--pri) 22%,transparent)}
select{width:auto;padding:7px 10px;max-width:100%}
.btn{background:var(--pri);color:var(--priT);font-weight:700}
.btn:hover:not(:disabled){box-shadow:0 6px 18px color-mix(in srgb,var(--pri) 35%,transparent);transform:translateY(-1px)}
.btn.sec{background:var(--surf2);color:var(--tx);border:1px solid var(--bd)}.btn.g{background:var(--a);color:#06100d}.btn.r{background:var(--bad);color:#fff}.btn.sm{padding:5px 12px;font-size:.88rem}
.btn:disabled{opacity:.55;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.sp{flex:1}
.kbtog{font:inherit;border:1px solid var(--bd);background:var(--surf2);color:var(--tx);border-radius:10px;padding:5px 12px;cursor:pointer;display:inline-flex;gap:7px;align-items:center}
.kbtog .ch{transition:transform .35s}body.nokb .kbtog .ch{transform:rotate(180deg)}
.kbwrap{display:grid;grid-template-rows:1fr;opacity:1;transition:grid-template-rows .4s cubic-bezier(.4,0,.2,1),opacity .3s,margin .3s;margin-top:10px}
.kbwrap>div{overflow:hidden;min-height:0}
body.nokb .kbwrap{grid-template-rows:0fr;opacity:0;margin-top:0}
.kbt{display:flex;gap:6px;margin:2px 0 8px}.kbt button{font:inherit;font-size:.85rem;border:1px solid var(--bd);background:var(--surf2);color:var(--mut);border-radius:8px;padding:2px 14px;cursor:pointer;transition:.2s}.kbt button.on{color:var(--priT);background:var(--pri);border-color:var(--pri)}
.keys{display:flex;flex-wrap:wrap;gap:6px;direction:ltr;padding-bottom:2px}
.k{min-width:42px;height:40px;font-size:1.05rem;border-radius:10px;border:1px solid var(--bd);background:var(--surf2);color:var(--tx);cursor:pointer;font-family:system-ui,"Cambria Math",serif;padding:0 8px;animation:pop .3s both;transition:.15s}
.k:hover{border-color:var(--pri);transform:translateY(-2px)}.k.w{background:var(--pri);color:var(--priT);border-color:var(--pri)}
.card{display:flex;gap:12px;align-items:flex-start;padding:12px;border:1px solid var(--bd);border-radius:14px;margin-bottom:10px;background:var(--surf2);animation:up .45s both;transition:border-color .2s,transform .2s}
.card:hover{border-color:var(--pri);transform:translateX(-3px)}
.card .t{flex:1;min-width:0;white-space:pre-wrap;word-break:break-word}.card .t small{color:var(--mut);margin-inline-end:6px}
.card .qq{color:var(--q);font-weight:700}.card .aa{color:var(--a)}
.tag{display:inline-flex;gap:5px;align-items:center;font-size:.8rem;color:var(--pri);background:color-mix(in srgb,var(--pri) 14%,transparent);padding:1px 9px;border-radius:99px;border:0;font-family:inherit;cursor:default;margin-inline-end:4px}
button.tag{cursor:pointer}
.mini{border:0;background:transparent;color:var(--mut);cursor:pointer;padding:6px;border-radius:8px;transition:.2s}.mini:hover{color:var(--tx);background:var(--surf)}
.mut{color:var(--mut)}.empty{text-align:center;color:var(--mut);padding:26px}
.tbar{height:8px;background:var(--surf2);border-radius:9px;overflow:hidden;margin:8px 0}.tbar i{display:block;height:100%;background:linear-gradient(90deg,var(--a),var(--pri));transition:width .25s linear}
.timer{font-variant-numeric:tabular-nums;font-size:1.3rem;font-weight:700;display:flex;gap:7px;align-items:center}.timer.low{color:var(--bad)}
.qtext{font-size:1.3rem;font-weight:500;white-space:pre-wrap;word-break:break-word}
.fb{border-radius:var(--r);padding:14px;margin-bottom:14px;border:1px solid var(--bd);background:var(--surf);animation:up .5s both}
.fb.ok{border-color:var(--ok)}.fb.no{border-color:var(--bad)}
.verdict{font-size:1.25rem;font-weight:700;display:flex;gap:8px;align-items:center}.ok .verdict{color:var(--ok)}.no .verdict{color:var(--bad)}
.verdict svg{width:1.5em;height:1.5em;animation:pop .5s .1s both}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.cmp div{background:var(--surf2);border-radius:10px;padding:10px;white-space:pre-wrap;word-break:break-word}.cmp span{display:block;font-size:.8rem;color:var(--mut)}
.big{font-size:3.2rem;font-weight:700;line-height:1.2;animation:pop .6s both}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0;text-align:center}.stats div{background:var(--surf2);border-radius:12px;padding:10px}
.hide{display:none!important}
.res{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd);animation:up .4s both}.res:last-child{border:0}.dot{width:12px;height:12px;border-radius:50%;flex:none}
.spin{display:inline-block;width:16px;height:16px;border:3px solid color-mix(in srgb,currentColor 30%,transparent);border-top-color:currentColor;border-radius:50%;animation:s .8s linear infinite}
.v{animation:up .45s both}
.refbox{white-space:pre-wrap;color:var(--mut);font-size:.92rem;margin-top:4px}
.quote{border-inline-start:3px solid var(--a);padding:4px 10px;margin-top:8px;color:var(--mut);font-size:.9rem;white-space:pre-wrap}
label.ck{display:inline-flex;gap:7px;align-items:center;cursor:pointer}
.up{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.up input{display:none}
.fbadge{display:inline-flex;gap:6px;align-items:center;background:var(--surf2);border:1px solid var(--bd);border-radius:99px;padding:3px 6px 3px 12px;font-size:.9rem}
/* periodic table */
.ptw{overflow-x:auto;padding-bottom:8px}
.pt{display:grid;grid-template-columns:repeat(18,minmax(44px,1fr));grid-template-rows:repeat(7,auto) 12px auto auto;gap:3px;min-width:860px}
.el{--c:var(--pri);font:inherit;cursor:pointer;border-radius:8px;border:1px solid color-mix(in srgb,var(--c) 45%,var(--bd));background:color-mix(in srgb,var(--c) 14%,var(--surf));color:var(--tx);padding:2px 2px 3px;text-align:center;line-height:1.15;animation:pop .35s both;transition:transform .15s,opacity .25s,box-shadow .2s;position:relative}
.el:hover{transform:scale(1.18);z-index:3;box-shadow:0 8px 20px rgba(0,0,0,.45)}
.el small{display:block;font-size:.62rem;color:var(--mut);text-align:start;padding-inline-start:3px}
.el b{display:block;font:700 1.05rem/1.1 "Poppins",system-ui,sans-serif;color:var(--c)}
.el span{display:block;font-size:.6rem;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.el.dim{opacity:.15}
.ph{border:1px dashed var(--bd);border-radius:8px;display:grid;place-items:center;font-size:.65rem;color:var(--mut)}
:root{--hl:#c8ff2e;--hlT:#0d1205}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--hl:#5aa800;--hlT:#fff}}
:root[data-theme="light"]{--hl:#5aa800;--hlT:#fff}
:root[data-theme="dark"]{--hl:#c8ff2e;--hlT:#0d1205}
@keyframes hlp{50%{transform:scale(1.12)}}
.el.hit{background:var(--hl);border-color:var(--hl);box-shadow:0 0 0 2px color-mix(in srgb,var(--hl) 45%,transparent),0 0 18px color-mix(in srgb,var(--hl) 65%,transparent);animation:hlp 1.6s ease-in-out infinite;z-index:2}
.el.hit b,.el.hit small,.el.hit span{color:var(--hlT)}
.c-alkali{--c:#e07a6a}.c-alk2{--c:#dd9c52}.c-tr{--c:#6f98e0}.c-post{--c:#7fb0a8}.c-meta{--c:#a88ee0}.c-non{--c:#4fb39a}.c-hal{--c:#d8c55c}.c-noble{--c:#c987c9}.c-lan{--c:#5cbbdc}.c-act{--c:#df80a6}
.leg{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.leg button{--c:var(--pri);font:inherit;font-size:.82rem;border:1px solid color-mix(in srgb,var(--c) 50%,var(--bd));background:color-mix(in srgb,var(--c) 12%,var(--surf));color:var(--tx);border-radius:99px;padding:2px 12px;cursor:pointer;transition:.2s}
.leg button.on{background:var(--c);color:#0b0b0b}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.62);display:grid;place-items:center;padding:14px;z-index:50;animation:fade .25s both;backdrop-filter:blur(3px)}
@keyframes fade{from{opacity:0}}
.sheet{background:var(--surf);border:1px solid var(--bd);border-radius:22px;max-width:620px;width:100%;max-height:92vh;overflow:auto;padding:18px;animation:up .35s both;position:relative}
.bohr{width:100%;max-width:260px;display:block;margin:0 auto}
.bohr g.sh{transform-origin:130px 130px;animation:rot linear infinite}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:10px 0}
.grid2 div{background:var(--surf2);border-radius:10px;padding:6px 10px}.grid2 span{display:block;font-size:.78rem;color:var(--mut)}
.cfg{direction:ltr;text-align:center;font-family:"Cambria Math",system-ui,serif;font-size:1.05rem;word-spacing:4px;background:var(--surf2);border-radius:10px;padding:8px}
.tundo{font:inherit;font-weight:700;margin-inline-start:14px;background:var(--bg);color:var(--tx);border:0;border-radius:99px;padding:2px 16px;cursor:pointer}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:9px 20px;border-radius:99px;font-weight:600;z-index:80;animation:up .3s both}
@media(max-width:560px){.cmp{grid-template-columns:1fr}nav button span{display:none}}
header .logo{order:1}header .icon{order:2}header nav{order:3;width:100%;flex-wrap:wrap;justify-content:center;border-radius:22px;overflow:visible}nav button{flex:none;padding:8px 13px}
.st4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.st4>div{background:var(--surf);border:1px solid var(--bd);border-radius:14px;padding:12px;text-align:center;animation:up .5s both}
.st4 b{display:block;font-size:1.6rem;line-height:1.2}.st4 span{font-size:.82rem;color:var(--mut)}
@media(max-width:560px){.st4{grid-template-columns:repeat(2,1fr)}}
.bars{display:flex;align-items:flex-end;gap:10px;height:150px}
.bars>div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:.78rem;color:var(--mut);gap:4px}
.bar{width:100%;max-width:38px;border-radius:8px 8px 4px 4px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;background:var(--surf2);min-height:4px}
.bar i{display:block;width:100%}
.ring{width:150px;height:150px;display:block;margin:0 auto}
.ring circle{fill:none;stroke-width:9}.ring .bg{stroke:var(--surf2)}.ring .fg{stroke:var(--pri);stroke-linecap:round;transition:stroke-dashoffset 1s linear;transform:rotate(-90deg);transform-origin:60px 60px}
.fcw{perspective:1200px;margin-bottom:14px}
.fcard{position:relative;min-height:260px;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.4,.2,.2,1);cursor:pointer}
.fcard.f{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:var(--r);padding:20px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;border:1px solid;overflow:auto}
.face.fr{background:var(--qbg);border-color:color-mix(in srgb,var(--q) 40%,var(--bd))}.face.bk{background:var(--abg);border-color:color-mix(in srgb,var(--a) 40%,var(--bd));transform:rotateY(180deg)}
.fm{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.fm button{font:inherit;font-size:.88rem;border:1px solid var(--bd);background:var(--surf2);color:var(--mut);border-radius:99px;padding:2px 14px;cursor:pointer;transition:.2s}.fm button.on{background:var(--pri);color:var(--priT);border-color:var(--pri)}
.fx{direction:ltr;text-align:center;font:1.25rem "Cambria Math",system-ui,serif;background:var(--surf2);border-radius:10px;padding:10px;margin:8px 0;overflow-x:auto}
.calc{max-width:420px;margin:0 auto 14px}
#cIn{direction:ltr;text-align:left;font-size:1.4rem}
#cRes{direction:ltr;text-align:left;font-size:2rem;font-weight:700;min-height:52px;padding:4px 6px;color:var(--pri)}
.cg{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;direction:ltr;margin-top:6px}
.cg button{height:48px;font:600 1.05rem system-ui,"Cambria Math",serif;border-radius:12px;border:1px solid var(--bd);background:var(--surf2);color:var(--tx);cursor:pointer;transition:.15s}
.cg button:hover{border-color:var(--pri)}.cg .op{color:var(--pri)}.cg .eq{background:var(--pri);color:var(--priT);border-color:var(--pri)}
input[type=date],input[type=number]{font:inherit;font-size:1rem;background:color-mix(in srgb,var(--bg) 55%,var(--surf2));color:var(--tx);border:1px solid var(--bd);border-radius:12px;padding:9px 12px;outline:none;width:auto}
.pin{background:linear-gradient(135deg,color-mix(in srgb,var(--pri) 24%,var(--surf)),var(--surf));border:1px solid color-mix(in srgb,var(--pri) 45%,var(--bd));border-radius:var(--r);padding:10px 14px;margin-bottom:14px;display:flex;gap:10px;align-items:center;animation:up .7s .25s both;overflow:hidden;max-height:260px;transition:max-height .5s,opacity .4s,padding .4s,margin .4s,border-width .4s}
.pin.out{max-height:0;opacity:0;padding-top:0;padding-bottom:0;margin-bottom:0;border-width:0}
.pq{font-family:"Amiri","Cairo",serif;font-size:1.3rem;line-height:1.9}
.ft{text-align:center;font-size:.72rem;color:var(--mut);padding:16px 0 26px;opacity:.8;letter-spacing:.3px}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.scard{--c:var(--pri);font:inherit;text-align:start;cursor:pointer;background:color-mix(in srgb,var(--c) 10%,var(--surf));border:1px solid color-mix(in srgb,var(--c) 40%,var(--bd));border-radius:16px;padding:12px;color:var(--tx);animation:pop .4s both;transition:transform .2s,box-shadow .2s;display:flex;flex-direction:column;gap:3px}
.scard:hover{transform:translateY(-4px);box-shadow:0 10px 24px rgba(0,0,0,.35)}
.sic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--c,var(--pri)) 22%,transparent);color:var(--c,var(--pri));font-size:1.3rem;flex:none}
.st{font:inherit;font-size:.8rem;border:1px solid var(--bd);border-radius:99px;padding:2px 12px;cursor:pointer;transition:.2s;background:var(--surf2);color:var(--mut);white-space:nowrap}
.st.s1{background:color-mix(in srgb,var(--pri) 25%,transparent);color:var(--pri);border-color:var(--pri)}.st.s2{background:color-mix(in srgb,var(--a) 25%,transparent);color:var(--a);border-color:var(--a)}
.td{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd);animation:up .35s both}.td:last-child{border:0}
.ckb{width:26px;height:26px;border-radius:50%;border:2px solid var(--bd);background:transparent;color:transparent;cursor:pointer;display:grid;place-items:center;flex:none;transition:.25s}.ckb.on{background:var(--a);border-color:var(--a);color:#06100d}.ckb svg{width:15px;height:15px}
.td.done .tx{text-decoration:line-through;color:var(--mut)}
.hb{display:grid;grid-template-columns:68px 1fr 64px;gap:8px;align-items:center;margin:5px 0}.hb .tbar{margin:0}.hb b{font-size:.85rem;text-align:end}
.noan .panel,.noan .td,.noan .scard,.noan .st4>div{animation:none}
.dk{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--bd);border-radius:14px;margin-bottom:8px;background:var(--surf2);cursor:pointer;transition:.25s;animation:up .4s both;user-select:none}
.dk.done{opacity:.5;border-color:var(--a)}.dk.tap{animation:tap .3s}
@keyframes tap{50%{transform:scale(.97);background:color-mix(in srgb,var(--a) 20%,var(--surf2))}}
.dkt{flex:1;font-family:"Amiri","Cairo",serif;font-size:1.3rem;line-height:2}
.dkb{min-width:48px;height:48px;border-radius:50%;border:2px solid var(--pri);color:var(--pri);display:grid;place-items:center;font:700 1.05rem "Poppins",sans-serif;flex:none;transition:.25s}.dk.done .dkb{background:var(--a);border-color:var(--a);color:#06100d}
.col{display:grid;grid-template-rows:1fr;opacity:1;transition:grid-template-rows .45s cubic-bezier(.4,0,.2,1),opacity .35s}.col.closed{grid-template-rows:0fr;opacity:0}.col>div{overflow:hidden;min-height:0}
.hdr{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">

function cat(z){if([2,10,18,36,54,86,118].includes(z))return'noble';if([3,11,19,37,55,87].includes(z))return'alkali';if([4,12,20,38,56,88].includes(z))return'alk2';if(z>=57&&z<=71)return'lan';if(z>=89&&z<=103)return'act';if([9,17,35,53,85,117].includes(z))return'hal';if([5,14,32,33,51,52].includes(z))return'meta';if([1,6,7,8,15,16,34].includes(z))return'non';if([13,31,49,50,81,82,83,84,113,114,115,116].includes(z))return'post';return'tr'}

function econf(z){let rem=z;const m={};for(const[n,l]of ORD){const t=Math.min(4*l+2,rem);m[n+SL[l]]=t;rem-=t;if(!rem)break}Object.assign(m,EXC[z]||{});

function renderPT(){
  const q=norm($('#ptS').value||''),qs=($('#ptS').value||'').trim().toLowerCase();let h='';
  ELS.forEach(x=>{const[r,c]=pos(x.z),ct=cat(x.z);
    const hit=ptHit(x,q,qs);
    h+=`<button class="el c-${ct}${hit?(qs?' hit':''):' dim'}" style="grid-row:${r};grid-column:${c};animation-delay:${Math.min(x.z,60)*6}ms" data-z="${x.z}"><small>${x.z}</small><b>${x.s}</b><span>${x.n}</span></button>`});
  h+=`<div class="ph" style="grid-row:6;grid-column:3">57-71</div><div class="ph" style="grid-row:7;grid-column:3">89-103</div>`;

  $('#leg').innerHTML=Object.keys(CATN).map(k=>`<button class="c-${k}${catF===k?' on':''}" data-cat="${k}">${CATN[k]}</button>`).join('')}
const ALIAS={13:'المنيوم الومنيوم ألمنيوم',8:'اوكسجين أكسيجين',7:'نتروجين ازوت',30:'خارصين',25:'منجنيز',74:'تنجستن وولفرام',53:'ايود',12:'ماغنسيوم مغنسيوم',14:'سيلكون',15:'فسفور',92:'اورانيوم',2:'هليوم'};
function ptHit(x,q,qs){if(catF&&catF!==cat(x.z))return false;if(!qs)return true;return !!(q&&(x.nn.includes(q)||norm(ALIAS[x.z]||'').split(' ').some(w=>w&&w.includes(q))))||x.s.toLowerCase().startsWith(qs)||String(x.z)===qs}
function ptFilter(){const q=norm($('#ptS').value||''),qs=($('#ptS').value||'').trim().toLowerCase();let n=0,one=0;
  document.querySelectorAll('#pt .el').forEach(b=>{const x=ELS[b.dataset.z-1],h=ptHit(x,q,qs);b.classList.toggle('dim',!h);b.classList.toggle('hit',!!qs&&h);if(h){n++;one=x.z}});
  document.querySelectorAll('#leg button').forEach(b=>b.classList.toggle('on',catF===b.dataset.cat));
  $('#ptN').textContent=(qs||catF)?(n?n+' عنصر':'لا توجد نتائج'):'';ptOne=n===1?one:0}

$('#leg').onclick=ev=>{const b=ev.target.closest('[data-cat]');if(!b)return;catF=catF===b.dataset.cat?null:b.dataset.cat;ptFilter()};
$('#pt').onclick=ev=>{const b=ev.target.closest('[data-z]');if(b)openEl(+b.dataset.z)};
function bohr(sh){const n=sh.length;let s=`<svg class="bohr" viewBox="0 0 260 260"><circle cx="130" cy="130" r="13" fill="var(--pri)"/>`;
  sh.forEach((k,i)=>{const R=26+i*(100/Math.max(n,5)*1.12+6),dir=i%2?'reverse':'normal';
    s+=`<circle cx="130" cy="130" r="${R}" fill="none" stroke="var(--bd)" stroke-width="1.3"/><g class="sh" style="animation-duration:${14+i*7}s;animation-direction:${dir}">`;
    for(let j=0;j<k;j++){const a=2*Math.PI*j/k;s+=`<circle cx="${130+R*Math.cos(a)}" cy="${130+R*Math.sin(a)}" r="4.2" fill="var(--q)"/>`}s+='</g>'});
  return s+'</svg>'}
function openEl(z){

}

/* ====== التصحيح ====== */
function norm(s){return String(s).toLowerCase().replace(/[\u064B-\u065F\u0670\u0640]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹]/g,d=>'⁰¹²³⁴⁵⁶⁷⁸⁹'.indexOf(d)).replace(/ة/g,'ه').replace(/[٠-٩]/g,d=>d.charCodeAt(0)-1632).replace(/[۰-۹]/g,d=>d.charCodeAt(0)-1776).replace(/٫|،(?=\d)/g,'.').replace(/[^\p{L}\p{N}.\/^+\-*=<>()√π²³°]/gu,' ').replace(/(^|\s)ال(?=\S{2})/g,'$1').replace(/\s+/g,' ').trim()}
function num(s){let t=norm(s).replace(/\s/g,'').replace(/^\((.*)\)$/,'$1').replace(/^\(([^()]*)\)\/\(([^()]*)\)$/,'$1/$2');const m=t.match(/^(-?\d+(?:\.\d+)?)(?:\/(\d+(?:\.\d+)?))?$/);if(!m)return null;return m[2]?(+m[1])/(+m[2]):+m[1]}
function lev(a,b){const m=a.length,n=b.length;if(!m||!n)return Math.max(m,n);let p=Array.from({length:n+1},(_,j)=>j);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
async function grade(c,ans){
  if(!c.a)return{ok:false,note:'لا توجد إجابة نموذجية لهذا السؤال.'};
  if(!ans.trim())return{ok:false,note:'لا توجد إجابة.'};
  const A=norm(c.a),B=norm(ans),sa=A.replace(/ /g,''),sb=B.replace(/ /g,'');
  if(A===B||sa===sb)return{ok:true,note:'مطابقة للإجابة النموذجية.'};
  const x=num(c.a),y=num(ans);
  if(x!==null&&y!==null)return Math.abs(x-y)<1e-9*Math.max(1,Math.abs(x))?{ok:true,note:'القيمة العددية متطابقة.'}:{ok:false,note:'القيمة العددية مختلفة.'};
  const sh=sa.length<sb.length?sa:sb,lg=sa.length<sb.length?sb:sa;
  if(sh.length>=3&&!/\d/.test(sh)&&lg.includes(sh)&&sh.length/lg.length>=0.5)return{ok:true,note:'الإجابة تحتوي المطلوب.'};
  const sim=1-lev(A,B)/Math.max(A.length,B.length);
  return sim>=0.82?{ok:true,note:'قريبة جداً من الإجابة (فرق طفيف).'}:{ok:false,note:'الإجابة تختلف عن النموذجية.'}}

const V=$('#vTest');
function stopT(){if(T&&T.iv)clearInterval(T.iv)}
const fmt=s=>{s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
function scopeList(v){const L=cards.filter(c=>c.a);if(v==='due')return L.filter(isDue);if(v.startsWith('sub:'))return L.filter(c=>c.subj===v.slice(4));if(v==='chem')return L.filter(c=>c.el||mentions(c.q+' '+c.a).length);return L}
function setup(){
  T=null;
  if(!cards.length){V.innerHTML=`<div class="panel empty">أضف أسئلة أولاً من صفحة «الأسئلة».</div>`;return}

  V.innerHTML=`<div class="panel"><div class="lab">${I('target')}إعدادات الاختبار</div>
  <div class="row" style="margin-bottom:10px"><label class="ck">${I('cards')} الأسئلة: <select id="scp">${scopeList('due').length?`<option value="due">مستحقة اليوم (${scopeList('due').length})</option>`:''}<option value="all">الكل (${scopeList('all').length})</option>${SUBJ.filter(s=>scopeList('sub:'+s.k).length).map(s=>`<option value="sub:${s.k}">${s.k} (${scopeList('sub:'+s.k).length})</option>`).join('')}${chem?`<option value="chem">كيمياء (${chem})</option>`:''}</select></label></div>

  <p style="margin-bottom:0"><button class="btn" id="go">${I('play')}<b>ابدأ الاختبار</b></button></p></div>`;
  $('#go').onclick=()=>{cfg.limit=+$('#lim').value;cfg.shuffle=$('#shf').checked;save('cfg',cfg);start(scopeList($('#scp').value))}}
function start(list){
  if(cfg.shuffle)list.sort(()=>Math.random()-.5);
  T={list,i:0,res:[],iv:null,t0:0,busy:false};askQ()}
function askQ(){
  const c=T.list[T.i];T.busy=false;
  V.innerHTML=`<div class="row panel" style="padding:10px 16px;margin-bottom:10px"><b>سؤال ${T.i+1} / ${T.list.length}</b><span class="sp"></span><span class="timer" id="tm">${I('clock')}<span>0:00</span></span></div><div class="tbar ${cfg.limit?'':'hide'}"><i id="tb" style="width:100%"></i></div>
  <div class="panel q"><div class="lab">${I('q')}السؤال</div><div class="qtext">${e(c.q)}</div></div>
  <div class="panel a"><div class="lab">${I('pen')}إجابتك</div><textarea id="ans" placeholder="اكتب إجابتك هنا…"></textarea><div id="kb2"></div></div>
  <div class="row"><button class="btn" id="sub">${I('check')}<b>تحقق من الإجابة</b></button><button class="btn sec" id="skip">${I('skip')}تخطي</button><button class="btn sec" id="quit">${I('flag')}إنهاء</button></div>`;
  mountKB('#kb2');$('#ans').focus();last=$('#ans');
  T.t0=Date.now();T.mode='ask';stopT();
  T.iv=setInterval(()=>{const s=(Date.now()-T.t0)/1000,tm=$('#tm');if(!tm)return;const sp=tm.lastElementChild;
    if(cfg.limit){const r=cfg.limit-s;sp.textContent=fmt(Math.ceil(r));tm.classList.toggle('low',r<=10);$('#tb').style.width=Math.max(0,r/cfg.limit*100)+'%';if(r<=0)submit(true)}
    else sp.textContent=fmt(s)},250);
  $('#sub').onclick=()=>submit(false);
  $('#skip').onclick=()=>{stopT();T.res.push({c,ans:'',ok:false,note:'تم تخطي السؤال.',time:elapsed(),correct:c.a});next()};
  $('#quit').onclick=()=>{stopT();finish()}}
function elapsed(){return Math.min((Date.now()-T.t0)/1000,cfg.limit||1e9)}
async function submit(timeout){
  if(T.busy)return;T.busy=true;stopT();
  const c=T.list[T.i],ans=($('#ans')||{}).value||'',time=elapsed();
  $('#sub').disabled=true;$('#sub').innerHTML='<span class="spin"></span><b>جارٍ التصحيح…</b>';$('#ans').disabled=true;
  const g=await grade(c,ans);T.res.push({c,ans,ok:g.ok,note:g.note,time,timeout,correct:g.correct||c.a,quote:g.quote});
  feedback(T.res[T.res.length-1])}
function feedback(r){T.mode='fb';
  const lastQ=T.i>=T.list.length-1;
  V.innerHTML=`<div class="fb ${r.ok?'ok':'no'}"><div class="verdict">${I(r.ok?'a':'x')}${r.ok?'إجابة صحيحة':'إجابة غير صحيحة'}${r.timeout?' (انتهى الوقت)':''}</div>
  <div class="mut">${e(r.note||'')} • ${fmt(r.time)}</div>
  <div class="panel q" style="margin:10px 0 0;animation:none"><div class="lab">${I('q')}السؤال</div><div style="white-space:pre-wrap">${e(r.c.q)}</div></div>
  <div class="cmp"><div><span>إجابتك</span>${e(r.ans||'— بدون إجابة —')}</div><div><span>الإجابة الصحيحة</span>${e(r.correct||'—')}</div></div>${r.quote?`<div class="quote">${e(r.quote)}</div>`:''}
  <button class="btn sec" id="ov">${r.ok?'اعتبرها خاطئة':'اعتبرها صحيحة'}</button></div>

let ANS=0,DEG=true,HIST=[];
function calcEval(s,deg){
  s=s.toLowerCase().replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/π/g,'(pi)').replace(/²/g,'^2').replace(/³/g,'^3').replace(/√/g,'sqrt').replace(/\s+/g,'');
  let i=0;const bad=()=>{throw 0};
  const fnc=(n,a)=>{const r=deg?a*Math.PI/180:a;switch(n){case'sin':return Math.sin(r);case'cos':return Math.cos(r);case'tan':return Math.tan(r);case'sqrt':return Math.sqrt(a);case'ln':return Math.log(a);case'log':return Math.log10(a);case'abs':return Math.abs(a);case'exp':return Math.exp(a)}bad()};
  function ex(){let v=tm();while(s[i]==='+'||s[i]==='-'){const o=s[i++],r=tm();v=o==='+'?v+r:v-r}return v}
  function tm(){let v=un();for(;;){const c=s[i];if(c==='*'||c==='/'){i++;const r=un();v=c==='*'?v*r:v/r}else if(c==='('||(c&&/[a-z]/.test(c))){v*=pw()}else break}return v}
  function un(){if(s[i]==='-'){i++;return -un()}if(s[i]==='+'){i++;return un()}return pw()}
  function pw(){const b=pf();if(s[i]==='^'){i++;return Math.pow(b,un())}return b}
  function pf(){let v=at();for(;;){if(s[i]==='!'){i++;if(v<0||v>170||v%1)bad();let r=1;for(let k=2;k<=v;k++)r*=k;v=r}else if(s[i]==='%'){i++;v/=100}else break}return v}
  function at(){if(s[i]==='('){i++;const v=ex();if(s[i]!==')')bad();i++;return v}
    let m=/^(\d+\.?\d*|\.\d+)/.exec(s.slice(i));if(m){i+=m[0].length;return +m[0]}
    m=/^[a-z]+/.exec(s.slice(i));if(m){i+=m[0].length;const n=m[0];if(n==='pi')return Math.PI;if(n==='e')return Math.E;if(s[i]!=='(')bad();i++;const a=ex();if(s[i]!==')')bad();i++;return fnc(n,a)}
    bad()}
  const v=ex();if(i<s.length)bad();return v}
function fracOf(v){if(Number.isInteger(v)||Math.abs(v)>=1e6)return'';for(let d=2;d<=1000;d++){const n=Math.round(v*d);if(Math.abs(n/d-v)<1e-9)return n+'/'+d}return''}
function cRun(commit){
  const s=$('#cIn').value.trim();if(!s){$('#cRes').textContent='';return}
  try{let v=calcEval(s.replace(/Ans/gi,'('+(+ANS.toPrecision(12))+')'),DEG);if(!isFinite(v))throw 0;if(Math.abs(v)<1e-12)v=0;
    const t=String(+v.toPrecision(12)),fr=fracOf(v);
    $('#cRes').innerHTML=e(t)+(fr?` <small class="mut" style="font-size:1rem">≈ ${fr}</small>`:'');
    if(commit){ANS=v;HIST.unshift(s+' = '+t);HIST=HIST.slice(0,5);$('#cH').innerHTML=HIST.map(x=>e(x)).join('<br>')}}
  catch(x){$('#cRes').textContent=commit?'خطأ':''}}
$('#cG').innerHTML=[['sin(','sin'],['cos(','cos'],['tan(','tan'],['(','('],[')',')'],['ln(','ln'],['log(','log'],['√(','√'],['^','^'],['π','π'],['7'],['8'],['9'],['÷','÷','op'],['C','C','op'],['4'],['5'],['6'],['×','×','op'],['⌫','⌫','op'],['1'],['2'],['3'],['−','−','op'],['Ans','Ans','op'],['0'],['.'],['%','%','op'],['+','+','op'],['=','=','eq']].map(b=>`<button data-v="${b[0]}" class="${b[2]||''}">${b[1]||b[0]}</button>`).join('');
$('#cG').onclick=ev=>{const b=ev.target.closest('button');if(!b)return;const v=b.dataset.v,el=$('#cIn');

const mins=m=>m>=60?Math.floor(m/60)+'س'+(m%60?' '+m%60+'د':''):m+'د';

function suggest(){
  let b=null;SUBJ.forEach(s=>{const d=daysLeft(s.k);if(d!=null&&d>=0&&d<=14&&(!b||d<b.d))b={d,k:s.k}});
  if(b)return`اختبار ${b.k} ${b.d?`بعد ${b.d} يوم`:'اليوم'} — خصّص له وقتاً اليوم.`;
  const w=SUBJ.map(s=>[s.k,[0,1,2,3,4,5,6].reduce((a,i)=>a+minsOn(day()-i,s.k),0)]).sort((a,b)=>a[1]-b[1]);
  return w[0][1]===0&&w[6][1]===0?'ابدأ بجلسة دراسة قصيرة لأي مادة.':`${w[0][0]} أقل مادة درستها هالأسبوع، جرّب جلسة قصيرة لها.`}

  return L.length?L.map((t,i)=>{const s=SUBJ.find(x=>x.k===t.sub);return`<div class="td${t.done?' done':''}" style="animation-delay:${Math.min(i,8)*30}ms"><button class="ckb${t.done?' on':''}" data-tt="${t.id}">${I('check')}</button><span class="tx" style="flex:1;word-break:break-word">${e(t.t)}</span>${s&&!k?`<span class="tag" style="color:${s.c}">${s.k}</span>`:''}<button class="mini" data-td="${t.id}">${I('trash')}</button></div>`}).join(''):'<div class="empty" style="padding:14px">لا توجد مهام.</div>'}

  <div class="panel"><div class="lab">${I('chart')}إنجازاتك</div>
  <div class="st4">${[[mins(tot),'إجمالي وقت الدراسة'],[dn,'دروس منجزة'],[ST.todos.filter(t=>t.done).length,'مهام منجزة'],[SUBJ.reduce((a,s)=>a+sub(s.k).sess.length,0),'جلسات دراسية']].map((x,i)=>`<div style="animation-delay:${i*70}ms"><b>${x[0]}</b><span>${x[1]}</span></div>`).join('')}</div>
  <div class="mut" style="margin:6px 0">وقت الدراسة لكل مادة</div>${SUBJ.map(s=>`<div class="hb"><span>${s.k}</span><div class="tbar"><i style="width:${subMin(s.k)/mx*100}%;background:${s.c}"></i></div><b>${mins(subMin(s.k))}</b></div>`).join('')}
  <div class="mut" style="margin:14px 0 6px">اكتمال الدروس</div>${SUBJ.map(s=>`<div class="hb"><span>${s.k}</span><div class="tbar"><i style="width:${subPct(s.k)}%;background:${s.c}"></i></div><b>${subPct(s.k)}%</b></div>`).join('')}
  <div class="mut" style="margin:14px 0 6px">آخر 7 أيام (دقائق)</div>${bars(wk,'var(--pri)')}</div>`}
function fileView(){
  const k=STV,S=SUBJ.find(x=>x.k===k),d=sub(k),L=d.lessons,p=subPct(k),dl=daysLeft(k),qs=cards.filter(c=>c.subj===k&&c.a),mast=qs.filter(c=>(c.box||0)>=4).length,lg=LOG.filter(x=>qs.some(c=>c.id===x.id)),acc=lg.length?Math.round(lg.filter(x=>x.ok).length/lg.length*100):null,cnt=[0,1,2].map(s=>L.filter(l=>l.s===s).length);

  <div class="panel"><div class="row"><div class="sic">${I(S.i)}</div><div><h2 style="margin:0">${k}</h2><div class="mut">ملف المادة</div></div><span class="sp"></span>${ring(p,S.c,78)}</div>
  <div class="row" style="margin-top:10px"><label class="ck">تاريخ الاختبار: <input type="date" id="exD" value="${d.exam||''}"></label>${dl!=null?`<span class="tag">${dl>=0?(dl?`بعد ${dl} يوم`:'اليوم'):'انتهى'}</span>`:''}</div></div>
  <div class="st4">${[[cnt[2]+'/'+L.length,'دروس منجزة'],[mins(subMin(k)),'وقت الدراسة'],[mast+'/'+qs.length,'أسئلة متقنة'],[acc==null?'—':acc+'%','دقة الأسئلة']].map((x,i)=>`<div style="animation-delay:${i*70}ms"><b>${x[0]}</b><span>${x[1]}</span></div>`).join('')}</div>
  <div class="panel"><div class="lab">${I('book')}الدروس</div>
  <div class="row" style="margin-bottom:8px"><input type="text" id="lsT" placeholder="اسم الدرس…" style="flex:1;min-width:150px"><input type="text" id="lsU" placeholder="الوحدة (اختياري)" style="width:150px"><button class="btn g" id="lsA">${I('plus')}</button></div>
  ${L.length?`<div class="tbar" style="display:flex;height:12px"><i style="width:${cnt[2]/L.length*100}%;background:var(--a)"></i><i style="width:${cnt[1]/L.length*100}%;background:var(--pri)"></i></div><div class="mut" style="font-size:.82rem;margin-bottom:6px">${cnt[2]} منجز • ${cnt[1]} قيد الدراسة • ${cnt[0]} لم يبدأ</div>`:''}

$('#vStudy').onclick=ev=>{
  const g=s=>ev.target.closest(s);let b;
  if(b=g('[data-sub]')){STV=b.dataset.sub;renderStudy(true);scrollTo({top:0});return}
  if(g('[data-back]')){STV=null;renderStudy(true);scrollTo({top:0});return}
  if(b=g('[data-f]')){tdF=b.dataset.f;renderStudy();return}
  if(b=g('[data-tt]')){const t=ST.todos.find(x=>x.id===b.dataset.tt);t.done=!t.done;svS();renderStudy();return}
  if(b=g('[data-td]')){snapS();ST.todos=ST.todos.filter(x=>x.id!==b.dataset.td);svS();renderStudy();undoS('تم حذف المهمة');return}
  if(b=g('#tdA')){const t=$('#tdT').value.trim();if(!t)return;const k=b.dataset.k||($('#tdS')?$('#tdS').value:'');ST.todos.push({id:uid(),t,sub:k,done:false,d:Date.now()});$('#tdT').value='';svS();renderStudy();return}
  if(g('#lsA')){const t=$('#lsT').value.trim();if(!t)return;sub(STV).lessons.push({id:uid(),t,u:$('#lsU').value.trim(),s:0});$('#lsT').value='';svS();renderStudy();return}
  if(b=g('[data-ls]')){const l=sub(STV).lessons.find(x=>x.id===b.dataset.ls);l.s=(l.s+1)%3;svS();renderStudy();return}
  if(b=g('[data-ld]')){snapS();const d=sub(STV);d.lessons=d.lessons.filter(x=>x.id!==b.dataset.ld);svS();renderStudy();undoS('تم حذف الدرس');return}
  if(g('#seA')){const m=Math.round(+$('#seM').value);if(!(m>0)){toast('اكتب عدد الدقائق');return}sub(STV).sess.push({id:uid(),d:day(),m,n:$('#seN').value.trim()});$('#seM').value='';$('#seN').value='';svS();renderStudy();toast('تم تسجيل الجلسة');return}
  if(b=g('[data-sd]')){snapS();const d=sub(STV);d.sess=d.sess.filter(x=>x.id!==b.dataset.sd);svS();renderStudy();undoS('تم حذف الجلسة');return}
  if(g('#stB')){if(stT.iv){clearInterval(stT.iv);stT.iv=null;const sec=(Date.now()-stT.t0)/1000;if(sec<20)toast('الجلسة قصيرة جداً');else{sub(stT.sub).sess.push({id:uid(),d:day(),m:Math.max(1,Math.round(sec/60)),n:'جلسة بالمؤقّت'});svS();toast('تم حفظ الجلسة')}}else{stT.t0=Date.now();stT.iv=setInterval(()=>{const el=$('#stT');if(el)el.textContent=fmtT()},1000)}renderStudy();return}
  if(g('[data-test]')){const l=scopeList('sub:'+STV);if(!l.length){toast('لا توجد أسئلة لهذه المادة');return}newTest(l);return}
  if(g('[data-addq]')){show('add');$('#qSub').value=STV||'';$('#qIn').focus()}};
$('#vStudy').onchange=ev=>{const t=ev.target;if(t.id==='goalS'){ST.goal=+t.value;svS();renderStudy()}else if(t.id==='stS')stT.sub=t.value;else if(t.id==='exD'){sub(STV).exam=t.value;svS();renderStudy()}};

const K1=['آية الكرسي','اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ ۚ لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ ۚ لَهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ ۗ مَنْ ذَا الَّذِي يَشْفَعُ عِنْدَهُ إِلَّا بِإِذْنِهِ ۚ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ ۖ وَلَا يُحِيطُونَ بِشَيْءٍ مِنْ عِلْمِهِ إِلَّا بِمَا شَاءَ ۚ وَسِعَ كُرْسِيُّهُ السَّمَاوَاتِ وَالْأَرْضَ ۖ وَلَا يَئُودُهُ حِفْظُهُمَا ۚ وَهُوَ الْعَلِيُّ الْعَظِيمُ',1];
const K3=[['سورة الإخلاص','قُلْ هُوَ اللَّهُ أَحَدٌ ۝ اللَّهُ الصَّمَدُ ۝ لَمْ يَلِدْ وَلَمْ يُولَدْ ۝ وَلَمْ يَكُنْ لَهُ كُفُوًا أَحَدٌ',3],['سورة الفلق','قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ ۝ مِنْ شَرِّ مَا خَلَقَ ۝ وَمِنْ شَرِّ غَاسِقٍ إِذَا وَقَبَ ۝ وَمِنْ شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ ۝ وَمِنْ شَرِّ حَاسِدٍ إِذَا حَسَدَ',3],['سورة الناس','قُلْ أَعُوذُ بِرَبِّ النَّاسِ ۝ مَلِكِ النَّاسِ ۝ إِلَٰهِ النَّاسِ ۝ مِنْ شَرِّ الْوَسْوَاسِ الْخَنَّاسِ ۝ الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ ۝ مِنَ الْجِنَّةِ وَالنَّاسِ',3]];
const KM=[['سيد الاستغفار','اللَّهُمَّ أَنْتَ رَبِّي لَا إِلَهَ إِلَّا أَنْتَ، خَلَقْتَنِي وَأَنَا عَبْدُكَ، وَأَنَا عَلَى عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ، أَعُوذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ، أَبُوءُ لَكَ بِنِعْمَتِكَ عَلَيَّ، وَأَبُوءُ بِذَنْبِي فَاغْفِرْ لِي، فَإِنَّهُ لَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ',1],['العافية','اللَّهُمَّ عَافِنِي فِي بَدَنِي، اللَّهُمَّ عَافِنِي فِي سَمْعِي، اللَّهُمَّ عَافِنِي فِي بَصَرِي، لَا إِلَهَ إِلَّا أَنْتَ',3],['الحفظ من الضرر','بِسْمِ اللَّهِ الَّذِي لَا يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الْأَرْضِ وَلَا فِي السَّمَاءِ وَهُوَ السَّمِيعُ الْعَلِيمُ',3],['الرضا','رَضِيتُ بِاللَّهِ رَبًّا، وَبِالْإِسْلَامِ دِينًا، وَبِمُحَمَّدٍ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ نَبِيًّا',3],['الحسبلة','حَسْبِيَ اللَّهُ لَا إِلَهَ إِلَّا هُوَ عَلَيْهِ تَوَكَّلْتُ وَهُوَ رَبُّ الْعَرْشِ الْعَظِيمِ',7]];
const KT=[['التسبيح','سُبْحَانَ اللَّهِ وَبِحَمْدِهِ',100],['التهليل','لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ',10],['الاستغفار','أَسْتَغْفِرُ اللَّهَ وَأَتُوبُ إِلَيْهِ',100],['الصلاة على النبي','اللَّهُمَّ صَلِّ وَسَلِّمْ عَلَى نَبِيِّنَا مُحَمَّدٍ',10]];
const AM=[K1,...K3,['ذكر الصباح','أَصْبَحْنَا وَأَصْبَحَ الْمُلْكُ لِلَّهِ، وَالْحَمْدُ لِلَّهِ، لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ. رَبِّ أَسْأَلُكَ خَيْرَ مَا فِي هَذَا الْيَوْمِ وَخَيْرَ مَا بَعْدَهُ، وَأَعُوذُ بِكَ مِنْ شَرِّ مَا فِي هَذَا الْيَوْمِ وَشَرِّ مَا بَعْدَهُ، رَبِّ أَعُوذُ بِكَ مِنَ الْكَسَلِ وَسُوءِ الْكِبَرِ، رَبِّ أَعُوذُ بِكَ مِنْ عَذَابٍ فِي النَّارِ وَعَذَابٍ فِي الْقَبْرِ',1],['اللهم بك أصبحنا','اللَّهُمَّ بِكَ أَصْبَحْنَا، وَبِكَ أَمْسَيْنَا، وَبِكَ نَحْيَا، وَبِكَ نَمُوتُ، وَإِلَيْكَ النُّشُورُ',1],...KM,['دعاء الصباح','اللَّهُمَّ إِنِّي أَسْأَلُكَ عِلْمًا نَافِعًا، وَرِزْقًا طَيِّبًا، وَعَمَلًا مُتَقَبَّلًا',1],...KT];
const AE=[K1,...K3,['ذكر المساء','أَمْسَيْنَا وَأَمْسَى الْمُلْكُ لِلَّهِ، وَالْحَمْدُ لِلَّهِ، لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ. رَبِّ أَسْأَلُكَ خَيْرَ مَا فِي هَذِهِ اللَّيْلَةِ وَخَيْرَ مَا بَعْدَهَا، وَأَعُوذُ بِكَ مِنْ شَرِّ مَا فِي هَذِهِ اللَّيْلَةِ وَشَرِّ مَا بَعْدَهَا، رَبِّ أَعُوذُ بِكَ مِنَ الْكَسَلِ وَسُوءِ الْكِبَرِ، رَبِّ أَعُوذُ بِكَ مِنْ عَذَابٍ فِي النَّارِ وَعَذَابٍ فِي الْقَبْرِ',1],['اللهم بك أمسينا','اللَّهُمَّ بِكَ أَمْسَيْنَا، وَبِكَ أَصْبَحْنَا، وَبِكَ نَحْيَا، وَبِكَ نَمُوتُ، وَإِلَيْكَ الْمَصِيرُ',1],...KM,['التعوّذ','أَعُوذُ بِكَلِمَاتِ اللَّهِ التَّامَّاتِ مِنْ شَرِّ مَا خَلَقَ',3],...KT];
let ADK=load('adk',{}),pinI=(+load('pinLast',-1)+1)%3;save('pinLast',pinI);
const dkN=(key,list)=>list.filter((x,i)=>(ADK[key][i]??x[2])<=0).length;
const dkHTML=(key,list)=>list.map((x,i)=>{const r=ADK[key][i]??x[2];return`<div class="dk${r<=0?' done':''}" data-dk="${key}:${i}" style="animation-delay:${Math.min(i,10)*35}ms"><div class="dkt"><small class="mut" style="font-family:Cairo,sans-serif;font-size:.8rem;display:block;line-height:1.5">${x[0]}${x[2]>1?' • '+x[2]+' مرات':''}</small>${x[1]}</div><div class="dkb">${r<=0?I('check'):r}</div></div>`}).join('');
function setHide(k,v){(cfg.adkHide||(cfg.adkHide={}))[k]=v;const c=$('#col-'+k);if(c)c.classList.toggle('closed',v);const b=document.querySelector(`[data-hide="${k}"]`);if(b)b.textContent=v?'إظهار':'إخفاء';save('cfg',cfg);const a=$('#adkAll');if(a)a.textContent=['m','e','d'].some(x=>!cfg.adkHide[x])?'إخفاء الكل':'إظهار الكل'}
function renderAdk(){
  if(ADK.d!==day())ADK={d:day(),m:{},e:{}};
  const hr=new Date().getHours(),H=cfg.adkHide||{};
  const sec=(key,title,ic,list,now)=>{const n=dkN(key,list),h=!!H[key];return`<div class="panel"><div class="hdr"><b style="font-size:1.1rem">${I(ic)} ${title}</b>${now?'<span class="tag">الوقت المناسب الآن</span>':''}<span class="sp"></span><span class="mut" id="pg-${key}">${n}/${list.length}</span><button class="mini" data-reset="${key}" title="إعادة">${I('redo')}</button><button class="btn sm sec" data-hide="${key}">${h?'إظهار':'إخفاء'}</button></div><div class="tbar"><i id="pb-${key}" style="width:${n/list.length*100}%"></i></div><div class="col${h?' closed':''}" id="col-${key}"><div style="padding-top:8px">${dkHTML(key,list)}</div></div></div>`};
  const dua=`<div class="panel"><div class="hdr"><b style="font-size:1.1rem">${I('heart')} أدعية للدراسة</b><span class="sp"></span><button class="btn sm sec" data-hide="d">${H.d?'إظهار':'إخفاء'}</button></div><div class="col${H.d?' closed':''}" id="col-d"><div style="padding-top:8px">${DU.map((x,i)=>`<div class="dk" style="cursor:default"><div class="dkt">${x[0]}<small class="mut" style="font-family:Cairo,sans-serif;font-size:.8rem;display:block;line-height:1.5">${x[1]}</small></div><button class="btn sm ${cfg.pinFix===i?'g':'sec'}" data-pin="${i}">${cfg.pinFix===i?'مثبّت':'ثبّت'}</button></div>`).join('')}</div></div></div>`;
  $('#vAdk').innerHTML=`<div class="row" style="margin-bottom:12px"><button class="btn sec sm" id="adkAll">${['m','e','d'].some(x=>!H[x])?'إخفاء الكل':'إظهار الكل'}</button><button class="btn sec sm" id="pinSh">${I('heart')}إظهار الدعاء المثبّت</button></div>`+sec('m','أذكار الصباح','sun',AM,hr<15)+sec('e','أذكار المساء','moon',AE,hr>=15)+dua+'<div class="mut" style="font-size:.8rem;text-align:center;margin-bottom:10px">الأذكار من القرآن الكريم والسنة النبوية.</div>'}
$('#vAdk').onclick=ev=>{
  const g=s=>ev.target.closest(s);let b;
  if(b=g('[data-hide]')){setHide(b.dataset.hide,!(cfg.adkHide||{})[b.dataset.hide]);return}
  if(g('#adkAll')){const any=['m','e','d'].some(x=>!(cfg.adkHide||{})[x]);['m','e','d'].forEach(k=>setHide(k,any));return}
  if(g('#pinSh')){pinShow();scrollTo({top:0,behavior:'smooth'});return}
  if(b=g('[data-reset]')){ADK[b.dataset.reset]={};save('adk',ADK);renderAdk();return}
  if(b=g('[data-pin]')){const i=+b.dataset.pin;if(cfg.pinFix===i)delete cfg.pinFix;else cfg.pinFix=i;save('cfg',cfg);renderAdk();pinShow();return}
  if(b=g('[data-dk]')){const[key,i]=b.dataset.dk.split(':'),list=key==='m'?AM:AE,r=ADK[key][i]??list[i][2];if(r<=0)return;ADK[key][i]=r-1;save('adk',ADK);
    b.classList.toggle('done',r-1<=0);b.querySelector('.dkb').innerHTML=r-1<=0?I('check'):r-1;b.classList.remove('tap');void b.offsetWidth;b.classList.add('tap');
    const n=dkN(key,list);$('#pg-'+key).textContent=n+'/'+list.length;$('#pb-'+key).style.width=n/list.length*100+'%'}};
function pinShow(){const i=cfg.pinFix!=null?cfg.pinFix:pinI,d=DU[i],p=$('#pin');p.className='pin';p.innerHTML=`<span style="color:var(--pri);font-size:1.3rem">${I('heart')}</span><div style="flex:1"><div class="pq">${d[0]}</div><small class="mut">${d[1]}</small></div><button class="mini" id="pinX" title="إخفاء">${I('close')}</button>`;$('#pinX').onclick=()=>p.classList.add('out');p.querySelector('.pq').style.cursor='pointer';p.querySelector('.pq').onclick=()=>show('adk')}

icons();applyTheme();mountKB('#kb1');renderAll();$('#qSub').innerHTML='<option value="">بدون مادة</option>'+SUBJ.map(x=>`<option>${x.k}</option>`).join('');pinShow();renderHome();renderFm();cRun();
</script>
</body>
</html>
